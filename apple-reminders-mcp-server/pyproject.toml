[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-reminders-mcp"
version = "1.0.0"
description = "Private Apple Reminders MCP server for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "pyicloud[cli]==2.7.0",
  "requests>=2.32,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
apple-reminders-mcp = "apple_reminders_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_reminders_mcp"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "UP017"]
